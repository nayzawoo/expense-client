<div class="flex min-h-dvh flex-col bg-gradient-to-b from-surface-100 to-surface-50">
  <div class="flex items-center justify-between px-4 py-4">
    <span class="text-lg font-semibold text-primary">{{ 'app.name' | translate }}</span>
    <app-language-switcher />
  </div>

  <div class="mx-auto flex w-full max-w-md flex-1 flex-col justify-center px-4 pb-16">
    <p class="mb-2 text-sm text-surface-500">{{ 'app.tagline' | translate }}</p>
    <h1 class="mb-6 text-3xl font-semibold tracking-tight text-surface-900">
      {{ 'auth.loginTitle' | translate }}
    </h1>

    @if (error()) {
      <p-message severity="error" styleClass="mb-4 w-full">{{ 'auth.failed' | translate }}</p-message>
    }

    <form class="flex flex-col gap-4" [formGroup]="form" (ngSubmit)="submit()">
      <label class="flex flex-col gap-2 text-sm font-medium text-surface-700">
        {{ 'auth.email' | translate }}
        <input pInputText type="email" formControlName="email" autocomplete="username" class="w-full" />
      </label>

      <label class="flex flex-col gap-2 text-sm font-medium text-surface-700">
        {{ 'auth.password' | translate }}
        <p-password
          formControlName="password"
          [feedback]="false"
          [toggleMask]="true"
          styleClass="w-full"
          inputStyleClass="w-full"
          autocomplete="current-password"
        />
      </label>

      <p-button
        type="submit"
        [label]="'auth.submit' | translate"
        [loading]="submitting()"
        styleClass="w-full"
      />
    </form>
  </div>
</div>
