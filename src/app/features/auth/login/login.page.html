<div class="flex min-h-dvh flex-col bg-gradient-to-b from-surface-100 to-surface-50">
  <div class="flex items-center justify-between px-4 py-4">
    <span class="text-lg font-semibold text-primary">{{ 'app.name' | translate }}</span>
    <app-language-switcher />
  </div>

  <div class="mx-auto flex w-full max-w-md flex-1 flex-col justify-center px-4 pb-16">
    <p class="mb-2 text-sm text-surface-500">{{ 'app.tagline' | translate }}</p>
    <h1 class="mb-6 text-3xl font-semibold tracking-tight text-surface-900">
      {{ 'auth.loginTitle' | translate }}
    </h1>

    @if (error()) {
      <app-ui-alert severity="error" class="mb-4 block">{{ 'auth.failed' | translate }}</app-ui-alert>
    }

    <form class="flex flex-col gap-4" [formGroup]="form" (ngSubmit)="submit()">
      <label class="flex flex-col gap-2 text-sm font-medium text-surface-700">
        {{ 'auth.email' | translate }}
        <input
          class="ui-input"
          type="email"
          formControlName="email"
          autocomplete="username"
        />
      </label>

      <label class="flex flex-col gap-2 text-sm font-medium text-surface-700">
        {{ 'auth.password' | translate }}
        <div class="relative">
          <input
            class="ui-input pr-20"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="current-password"
          />
          <button
            type="button"
            class="absolute inset-y-0 right-1 my-1 rounded-md px-2 text-xs font-semibold text-surface-600 hover:bg-surface-100"
            (click)="showPassword.set(!showPassword())"
          >
            {{ showPassword() ? ('auth.hidePassword' | translate) : ('auth.showPassword' | translate) }}
          </button>
        </div>
      </label>

      <app-ui-button type="submit" [block]="true" [loading]="submitting()">
        {{ 'auth.submit' | translate }}
      </app-ui-button>
    </form>
  </div>
</div>
